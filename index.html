<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OneDrive Storage Drilldown</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f6f8fb;
      color: #1f2937;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    input[type="number"] {
      width: 6rem;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.95rem;
    }

    label.input-label {
      font-size: 0.95rem;
      white-space: nowrap;
      color: #334155;
    }

    .truncated-note {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-left: 0.5rem;
    }

    .inline-action {
      font-size: 0.75rem;
      padding: 0.2rem 0.45rem;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    button {
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      padding: 0.65rem 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #93c5fd;
      cursor: wait;
    }

    button.secondary {
      background: #0f172a;
    }

    #status {
      font-size: 0.95rem;
      color: #334155;
    }

    #statusText {
      white-space: pre-line;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.75rem;
    }

    .metric {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.75rem;
      background: #f8fafc;
    }

    .metric strong {
      display: block;
      font-size: 1.1rem;
      margin-top: 0.25rem;
      word-break: break-word;
    }

    details {
      margin-left: 1rem;
      border-left: 1px solid #e5e7eb;
      padding-left: 0.75rem;
    }

    summary {
      cursor: pointer;
      list-style: none;
      margin-bottom: 0.3rem;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .node-title {
      display: grid;
      grid-template-columns: auto minmax(110px, 1fr) auto;
      gap: 0.5rem;
      align-items: center;
    }

    .bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #60a5fa, #2563eb);
    }

    .path {
      color: #64748b;
      font-size: 0.83rem;
      margin-top: 0.15rem;
      word-break: break-word;
    }

    .hidden {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 1em;
      height: 1em;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5em;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>OneDrive Storage Drilldown</h1>
      <p>
        Melde dich mit deinem Microsoft-Konto an. Nach dem Login kannst du die Analyse starten, damit die gewählte maximale Tiefe berücksichtigt wird.
      </p>
      <div class="row">
        <button id="loginBtn" type="button" class="secondary">Mit Microsoft anmelden</button>
        <button id="startBtn" type="button" class="hidden">Analyse starten</button>
        <label for="maxDepthInput" class="input-label">Max. Tiefe:</label>
        <input id="maxDepthInput" type="number" min="1" max="20" placeholder="∞" title="Maximale Ordnertiefe (leer = unbegrenzt)" />
      </div>
      <p id="status" aria-live="polite"><span id="spinner" class="spinner hidden" aria-hidden="true"></span><span id="statusText">Warte auf Token…</span></p>
    </section>

    <section id="summaryCard" class="card hidden">
      <h2>Übersicht</h2>
      <div id="metrics" class="metrics"></div>
    </section>

    <section id="treeCard" class="card hidden">
      <h2>Drilldown</h2>
      <div id="tree"></div>
    </section>
  </main>

  <script src="./auth-config.js"></script>
  <script>
    const graphRoot = 'https://graph.microsoft.com/v1.0';
    const authConfig = window.ONE_DRIVE_AUTH_CONFIG || {};
    const tenantId = authConfig.tenantId || '';
    const clientId = authConfig.clientId || '';
    const authEndpoint = `https://login.microsoftonline.com/${tenantId}/oauth2/v2.0/authorize`;
    const authScopes = ['https://graph.microsoft.com/Files.Read', 'https://graph.microsoft.com/User.Read'];
    const authStateStorageKey = 'onedrive-storage-drilldown-auth-state';
    const maxDepthStorageKey = 'onedrive-storage-drilldown-max-depth';
    const authParamNames = [
      'access_token',
      'token',
      'error',
      'error_description',
      'state',
      'session_state',
      'expires_in',
      'ext_expires_in',
      'scope',
      'token_type'
    ];
    const statusTextEl = document.getElementById('statusText');
    const spinnerEl = document.getElementById('spinner');
    const loginBtn = document.getElementById('loginBtn');
    const startBtn = document.getElementById('startBtn');
    const summaryCard = document.getElementById('summaryCard');
    const treeCard = document.getElementById('treeCard');
    const metricsEl = document.getElementById('metrics');
    const treeEl = document.getElementById('tree');
    const maxDepthInput = document.getElementById('maxDepthInput');
    const childrenQuery = '$top=200&$select=id,name,size,folder,file';
    // 3 concurrent Graph API calls – reduced to stay within personal OneDrive quota limits.
    const concurrencyLimit = 3;
    const MAX_RETRIES = 7;
    const DEFAULT_RETRY_AFTER_SECONDS = 15;

    restoreMaxDepthFromStorage();

    const authState = extractAuthStateFromUrl();
    if (authState.cleanedUrl) {
      window.history.replaceState({}, document.title, authState.cleanedUrl);
    }

    let activeToken = authState.token;
    let lastProgressUpdate = 0;
    let currentRoot = null;
    let currentCounters = null;
    if (authState.error) {
      setStatus(`Login fehlgeschlagen: ${authState.error}`);
    } else if (!tenantId || !clientId) {
      console.warn('Microsoft login is not configured: missing clientId or tenantId in auth-config.js');
      setStatus('Microsoft-Login ist noch nicht konfiguriert. Bitte Client-ID und Tenant-ID prüfen.');
    } else if (activeToken) {
      setStatus('Token aus Redirect URL erkannt. Klicke auf „Analyse starten“.');
      startBtn.classList.remove('hidden');
    } else {
      setStatus('Bitte mit Microsoft anmelden.');
    }

    loginBtn.addEventListener('click', startLogin);
    startBtn.addEventListener('click', () => loadAndRender(activeToken));
    maxDepthInput.addEventListener('change', persistMaxDepthToStorage);

    function extractAuthStateFromUrl() {
      const url = new URL(window.location.href);
      const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
      const hashParams = new URLSearchParams(hash);
      const queryParams = url.searchParams;
      const returnedState = hashParams.get('state') || queryParams.get('state') || '';
      const token = (
        hashParams.get('access_token') ||
        queryParams.get('access_token') ||
        queryParams.get('token') ||
        ''
      );
      const expectedState = getStoredAuthState();
      let error = extractAuthError(hashParams, queryParams);

      if (token) {
        if (!returnedState) {
          error = 'Ungültige Login-Antwort ohne Statuswert. Bitte den Login erneut starten.';
        } else if (!isValidReturnedAuthState(returnedState, expectedState)) {
          error = 'Ungültiger Login-Status. Bitte den Login erneut starten.';
        }
      }

      let cleanedUrl = '';
      let shouldCleanUrl = false;
      for (const name of authParamNames) {
        if (queryParams.has(name)) {
          queryParams.delete(name);
          shouldCleanUrl = true;
        }
        if (hashParams.has(name)) {
          shouldCleanUrl = true;
        }
      }

      if (shouldCleanUrl) {
        const cleaned = new URL(window.location.href);
        cleaned.search = queryParams.toString() ? `?${queryParams.toString()}` : '';
        cleaned.hash = '';
        cleanedUrl = cleaned.toString();
      }

      const validatedToken = token && !error ? token : '';

      return {
        token: validatedToken,
        error,
        cleanedUrl
      };
    }

    function extractAuthError(hashParams, queryParams) {
      const errorCode = hashParams.get('error') || queryParams.get('error') || '';
      const errorDescription = hashParams.get('error_description') || queryParams.get('error_description') || '';
      if (errorCode && errorDescription) {
        return `${errorCode}: ${errorDescription}`;
      }
      return errorCode || errorDescription || '';
    }

    function startLogin() {
      if (!tenantId || !clientId) {
        setStatus('Microsoft-Login ist noch nicht konfiguriert. Bitte Client-ID und Tenant-ID prüfen.');
        return;
      }
      persistMaxDepthToStorage();
      const state = createAuthState();
      if (!state) {
        setStatus('Microsoft-Login konnte nicht gestartet werden. Bitte einen aktuellen Browser verwenden oder den Token manuell einfügen.');
        return;
      }
      if (!persistAuthState(state)) {
        setStatus('Microsoft-Login konnte nicht gestartet werden, weil der Browser keinen sicheren Sitzungsspeicher bereitstellt. Bitte Browser-Einstellungen prüfen oder Token manuell einfügen.');
        return;
      }
      window.location.assign(buildLoginUrl(state));
    }

    function buildLoginUrl(state) {
      const redirectUrl = new URL(window.location.href);
      redirectUrl.search = '';
      redirectUrl.hash = '';
      const params = new URLSearchParams({
        client_id: clientId,
        response_type: 'token',
        redirect_uri: redirectUrl.toString(),
        response_mode: 'fragment',
        scope: authScopes.join(' '),
        prompt: 'select_account',
        state
      });
      return `${authEndpoint}?${params.toString()}`;
    }

    function createAuthState() {
      if (window.crypto?.randomUUID) {
        return window.crypto.randomUUID();
      }
      if (window.crypto?.getRandomValues) {
        const bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
      }
      return '';
    }

    function persistMaxDepthToStorage() {
      try {
        const depthValue = maxDepthInput.value.trim();
        if (!depthValue) {
          window.sessionStorage.removeItem(maxDepthStorageKey);
          return;
        }
        window.sessionStorage.setItem(maxDepthStorageKey, depthValue);
      } catch {
        // Ignore unavailable storage and continue.
      }
    }

    function restoreMaxDepthFromStorage() {
      try {
        const storedValue = window.sessionStorage.getItem(maxDepthStorageKey) || '';
        const depth = parseInt(storedValue, 10);
        if (Number.isInteger(depth) && depth >= 1 && depth <= 20) {
          maxDepthInput.value = String(depth);
        }
      } catch {
        // Ignore unavailable storage and continue.
      }
    }

    function persistAuthState(state) {
      try {
        window.sessionStorage.setItem(authStateStorageKey, state);
        return true;
      } catch {
        return false;
      }
    }

    function getStoredAuthState() {
      try {
        return window.sessionStorage.getItem(authStateStorageKey) || '';
      } catch {
        return '';
      }
    }

    function isValidReturnedAuthState(returnedState, expectedState) {
      if (!returnedState) {
        return false;
      }
      if (!expectedState) {
        return false;
      }
      if (expectedState !== returnedState) {
        return false;
      }

      try {
        window.sessionStorage.removeItem(authStateStorageKey);
        return true;
      } catch {
        return false;
      }
    }

    function setStatus(message) {
      statusTextEl.textContent = message;
    }

    function showSpinner() {
      spinnerEl.classList.remove('hidden');
    }

    function hideSpinner() {
      spinnerEl.classList.add('hidden');
    }

    function isLikelyAccessToken(token) {
      return typeof token === 'string' && token.length > 20 && !/[\s\r\n]/.test(token);
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes < 0) return '0 B';
      if (bytes < 1024) return `${bytes} B`;
      const units = ['KB', 'MB', 'GB', 'TB'];
      let value = bytes;
      let unit = 'B';
      for (const nextUnit of units) {
        value /= 1024;
        unit = nextUnit;
        if (value < 1024) break;
      }
      return `${value.toFixed(value >= 10 ? 1 : 2)} ${unit}`;
    }

    async function graphGet(url, token, retriesLeft = MAX_RETRIES) {
      const res = await fetch(url, {
        headers: {
          Authorization: 'Bearer ' + token
        }
      });
      if (res.status === 429 || res.status === 503) {
        if (retriesLeft <= 0) {
          throw new Error(`Graph API Anfragelimit überschritten (${res.status}). Bitte einige Minuten zu warten und es erneut versuchen.`);
        }
        const retryAfter = parseInt(res.headers.get('Retry-After') || String(DEFAULT_RETRY_AFTER_SECONDS), 10);
        // Honor up to 5 minutes of Retry-After – quota throttles (innerError.code "quota") may require longer waits.
        const waitMs = (isNaN(retryAfter) ? DEFAULT_RETRY_AFTER_SECONDS : Math.min(retryAfter, 300)) * 1000;
        // Check for quota-specific throttle to show a targeted hint.
        const errorBody = await safeJson(res.clone());
        const isQuota = errorBody?.error?.innerError?.innerError?.code === 'quota';
        const attempt = MAX_RETRIES - retriesLeft + 1;
        const hint = isQuota
          ? `API-Kontingent erschöpft – warte ${waitMs / 1000} s (Versuch ${attempt}/${MAX_RETRIES})…`
          : `Graph API Drosselung – warte ${waitMs / 1000} s…`;
        setStatus(hint);
        await new Promise(resolve => setTimeout(resolve, waitMs));
        return graphGet(url, token, retriesLeft - 1);
      }
      if (!res.ok) {
        const errorBody = await safeJson(res);
        const message = errorBody?.error?.message || `Graph request failed (${res.status})`;
        throw new Error(message);
      }
      return res.json();
    }

    async function safeJson(res) {
      try {
        return await res.json();
      } catch {
        return null;
      }
    }

    async function listChildren(itemId, token) {
      const base = itemId
        ? `${graphRoot}/me/drive/items/${encodeURIComponent(itemId)}/children?${childrenQuery}`
        : `${graphRoot}/me/drive/root/children?${childrenQuery}`;

      const entries = [];
      let nextUrl = base;
      while (nextUrl) {
        const page = await graphGet(nextUrl, token);
        entries.push(...(page.value || []));
        nextUrl = page['@odata.nextLink'] || null;
      }
      return entries;
    }

    async function limitedParallel(taskFns, concurrency) {
      const results = new Array(taskFns.length);
      let next = 0;

      async function worker() {
        while (next < taskFns.length) {
          const idx = next++;
          results[idx] = await taskFns[idx]();
        }
      }

      await Promise.all(Array.from({ length: Math.min(concurrency, taskFns.length) }, worker));
      return results;
    }

    async function analyzeFolder(itemId, name, path, token, counters, depth = 0, maxDepth = Infinity) {
      const now = Date.now();
      if (now - lastProgressUpdate >= 100) {
        lastProgressUpdate = now;
        setStatus(`Analysiere:\n${path} (${counters.folders} Ordner, ${counters.files} Dateien bisher…)`);
      }
      const childrenRaw = await listChildren(itemId, token);
      const children = [];
      let folderSize = 0;
      const subFolderTasks = [];

      for (const child of childrenRaw) {
        const childPath = `${path}/${child.name}`;
        if (child.folder) {
          counters.folders += 1;
          if (depth >= maxDepth) {
            // Use the size already provided by the Graph API – no further API calls needed.
            const apiSize = Number(child.size || 0);
            children.push({
              id: child.id,
              name: child.name,
              path: childPath,
              type: 'folder',
              size: apiSize,
              children: [],
              truncated: true
            });
            folderSize += apiSize;
          } else {
            subFolderTasks.push({ child, childPath });
          }
        } else {
          counters.files += 1;
          const fileSize = Number(child.size || 0);
          children.push({
            id: child.id,
            name: child.name,
            path: childPath,
            type: 'file',
            size: fileSize,
            children: []
          });
          folderSize += fileSize;
        }
      }

      // Fetch all sub-folders in parallel, respecting the concurrency limit.
      const folderResults = await limitedParallel(
        subFolderTasks.map(({ child, childPath }) => () =>
          analyzeFolder(child.id, child.name, childPath, token, counters, depth + 1, maxDepth)
        ),
        concurrencyLimit
      );

      for (const folder of folderResults) {
        children.push(folder);
        folderSize += folder.size;
      }

      children.sort((a, b) => b.size - a.size);

      return {
        id: itemId || 'root',
        name,
        path,
        type: 'folder',
        size: folderSize,
        children
      };
    }

    function findLargest(root, type) {
      const stack = [...(root.children || [])];
      let largest = null;

      while (stack.length) {
        const node = stack.pop();
        if (node.type === type && (!largest || node.size > largest.size)) {
          largest = node;
        }
        if (node.children?.length) {
          stack.push(...node.children);
        }
      }

      return largest;
    }

    function renderSummary(root, counters) {
      const largestFolder = findLargest(root, 'folder');
      const largestFile = findLargest(root, 'file');

      metricsEl.innerHTML = '';
      const metrics = [
        { label: 'Gesamtspeicher', value: formatBytes(root.size) },
        { label: 'Ordner gesamt', value: String(counters.folders) },
        { label: 'Dateien gesamt', value: String(counters.files) },
        {
          label: 'Größter Ordner',
          value: largestFolder ? `${largestFolder.name} (${formatBytes(largestFolder.size)})` : '-'
        },
        {
          label: 'Pfad größter Ordner',
          value: largestFolder ? largestFolder.path : '-'
        },
        {
          label: 'Größte Datei',
          value: largestFile ? `${largestFile.name} (${formatBytes(largestFile.size)})` : '-'
        },
        {
          label: 'Pfad größte Datei',
          value: largestFile ? largestFile.path : '-'
        }
      ];

      for (const metric of metrics) {
        const box = document.createElement('div');
        box.className = 'metric';
        box.innerHTML = `<span>${metric.label}</span><strong>${escapeHtml(metric.value)}</strong>`;
        metricsEl.appendChild(box);
      }

      summaryCard.classList.remove('hidden');
    }

    function renderTree(root) {
      treeEl.innerHTML = '';
      treeEl.appendChild(renderNode(root, root.size, true));
      treeCard.classList.remove('hidden');
    }

    function renderNode(node, totalSize, expanded = false) {
      const container = document.createElement('details');
      container.open = expanded;
      const ratio = totalSize > 0 ? Math.round((node.size / totalSize) * 1000) / 10 : 0;

      const summary = document.createElement('summary');
      summary.innerHTML = `
        <div class="node-title">
          <span>${node.type === 'folder' ? '📁' : '📄'} ${escapeHtml(node.name)}</span>
          <span class="bar"><span style="width: ${ratio}%"></span></span>
          <strong>${formatBytes(node.size)}</strong>
        </div>
        <div class="path">${escapeHtml(node.path)}</div>
      `;
      container.appendChild(summary);

      for (const child of node.children || []) {
        if (child.children?.length) {
          container.appendChild(renderNode(child, node.size));
        } else {
          const leaf = document.createElement('div');
          leaf.style.margin = '0.25rem 0 0.35rem 0';
          // Folders use 📁 even when truncated – they are structurally folders, just not fully analysed.
          const icon = child.type === 'folder' ? '📁' : '📄';
          const truncatedHint = child.truncated
            ? '<span class="truncated-note" title="Inhalt nicht analysiert – Größe laut API">(nicht weiter analysiert)</span>'
            : '';
          leaf.innerHTML = `
            <div class="node-title">
              <span>${icon} ${escapeHtml(child.name)}${truncatedHint}</span>
              <span class="bar"><span style="width: ${node.size > 0 ? Math.round((child.size / node.size) * 1000) / 10 : 0}%"></span></span>
              <strong>${formatBytes(child.size)}</strong>
            </div>
            <div class="path">${escapeHtml(child.path)}</div>
          `;
          if (child.type === 'folder' && child.truncated) {
            const loadMoreBtn = document.createElement('button');
            loadMoreBtn.type = 'button';
            loadMoreBtn.className = 'inline-action';
            loadMoreBtn.textContent = 'Mehr laden';
            loadMoreBtn.addEventListener('click', () => loadMoreFolder(child, loadMoreBtn));
            leaf.querySelector('.path')?.appendChild(loadMoreBtn);
          }
          container.appendChild(leaf);
        }
      }

      return container;
    }

    function escapeHtml(input) {
      return String(input)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function loadAndRender(token) {
      if (!isLikelyAccessToken(token)) {
        setStatus('Ungültiger Access Token. Bitte den Login erneut starten.');
        return;
      }
      activeToken = token;
      loginBtn.disabled = true;
      startBtn.disabled = true;
      lastProgressUpdate = 0;
      showSpinner();
      setStatus('Lade OneDrive-Daten. Das kann je nach Größe etwas dauern…');
      summaryCard.classList.add('hidden');
      treeCard.classList.add('hidden');

      const maxDepthValue = parseInt(maxDepthInput.value, 10);
      // The HTML input enforces min=1 and max=20; mirror those bounds here for consistency.
      const maxDepth = Number.isInteger(maxDepthValue) && maxDepthValue >= 1 && maxDepthValue <= 20
        ? maxDepthValue
        : Infinity;

      try {
        const counters = { folders: 1, files: 0 };
        currentCounters = counters;
        const root = await analyzeFolder('', 'Root', '/Root', activeToken, counters, 0, maxDepth);
        currentRoot = root;
        renderSummary(root, counters);
        renderTree(root);
        setStatus(`Analyse abgeschlossen: ${formatBytes(root.size)} in ${counters.folders} Ordnern und ${counters.files} Dateien.`);
      } catch (error) {
        currentRoot = null;
        currentCounters = null;
        setStatus(`Fehler: ${error.message}`);
      } finally {
        hideSpinner();
        loginBtn.disabled = false;
        startBtn.disabled = false;
      }
    }

    async function loadMoreFolder(node, triggerBtn) {
      if (!node?.id || !node.truncated || !activeToken || !currentRoot || !currentCounters) {
        return;
      }
      triggerBtn.disabled = true;
      loginBtn.disabled = true;
      startBtn.disabled = true;
      showSpinner();
      setStatus(`Analysiere tiefer: ${node.path}`);

      try {
        const expandedFolder = await analyzeFolder(node.id, node.name, node.path, activeToken, currentCounters, 0, Infinity);
        node.children = expandedFolder.children;
        node.size = expandedFolder.size;
        node.truncated = false;
        renderSummary(currentRoot, currentCounters);
        renderTree(currentRoot);
        setStatus(`Bereich aktualisiert: ${node.path}`);
      } catch (error) {
        setStatus(`Fehler beim Nachladen von ${node.path}: ${error.message}`);
        if (triggerBtn.isConnected) {
          triggerBtn.disabled = false;
        }
      } finally {
        hideSpinner();
        loginBtn.disabled = false;
        startBtn.disabled = false;
      }
    }
  </script>
</body>
